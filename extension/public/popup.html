<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>네이버 카페 엑셀 내보내기</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="head">
      <span class="logo">📗</span>
      <div>
        <div class="title">카페 엑셀 내보내기</div>
        <div class="sub">게시글·댓글·작성자·회원 → .xlsx</div>
      </div>
    </div>

    <div id="ctx" class="ctx">카페를 확인하는 중…</div>
    <div id="access" class="access hidden"></div>

    <button id="open" class="primary" disabled>수집 화면 열기</button>
    <button id="connect" class="ghost">계정 연결 / 구독</button>

    <p class="note">
      공개로 읽을 수 있는 콘텐츠는 로그인 없이 수집됩니다. 카페 가입·등업이 필요한 콘텐츠는
      카페에서 직접 조건을 완료한 뒤 수집할 수 있습니다.
    </p>
    <p class="note small">미리보기는 무료(최대 20개), 전체 수집은 월 ₩4,900 구독이 필요합니다.</p>

    <script src="popup.js"></script>
  </body>
</html>
